name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests and web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Jest runs on Node; Bun installs packages and runs the workspace scripts.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format (Biome)
        run: bun run check:ci

      - name: Generated Cal API v2 types match the pinned spec
        working-directory: packages/cal-api
        run: bun run generate:check

      - name: Type check
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Bundle the app for web
        working-directory: apps/mobile
        run: bunx expo export --platform web --output-dir dist
